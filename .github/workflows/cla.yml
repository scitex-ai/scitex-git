name: CLA Assistant

# Org-level reusable-workflow caller (scitex-ai/.github).
# Triggers/permissions preserved verbatim from the prior local file.
# The repo's prior allowlist adds LLEmacs to the reusable default, so
# `owner_allowlist` is overridden below. `runs_on` is passed explicitly:
# outsiders trigger this workflow, so it must run on GitHub-hosted runners.
# The PAT remap (CLA_PERSONAL_ACCESS_TOKEN -> GH_PERSONAL_ACCESS_TOKEN)
# is expressed as the explicit secret mapping below, never `secrets: inherit`.
#
# Status-check context becomes "CLA Assistant / CLAssistant"; it is not a
# required context on develop or main (checked 2026-11-17).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
      runs_on: '["ubuntu-latest"]'
    # Pass the ONE secret the callee declares, never `secrets: inherit`.
    # This job is startable by an outsider (`issue_comment`,
    # `pull_request_target`); inheriting would forward every secret this
    # repo holds into it.
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
