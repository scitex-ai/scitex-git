name: CLA Assistant

# Org-level reusable-workflow caller (scitex-ai/.github#claremont, 2026-07-10).
# Triggers/permissions preserved verbatim from the prior local file.
# Reusable defaults (owner_login=ywatanabe1989,
# owner_allowlist="bot*,ywatanabe1989", default_branch=main) match this
# repo's prior hardcoded values, so no input overrides are needed.
# The PAT remap (CLA_PERSONAL_ACCESS_TOKEN -> GH_PERSONAL_ACCESS_TOKEN)
# is expressed as the explicit secret mapping below, never `secrets: inherit`.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    # Pass the ONE secret the callee declares, never `secrets: inherit`.
    # This job is startable by an outsider (`issue_comment`,
    # `pull_request_target`); inheriting would forward every secret this
    # repo holds into it.
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
